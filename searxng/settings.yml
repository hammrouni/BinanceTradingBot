# SearXNG for the Binance bot's AI Optimizer (web research). Internal only: no host port is published.
use_default_settings:
  engines:
    # Google / DuckDuckGo / Brave answer with CAPTCHAs or rate limits to a home IP, so only keep engines that don't.
    keep_only:
      - yahoo
      - yep
      - wikipedia
      - stackoverflow
      - hackernews
      - arxiv
      - github

general:
  instance_name: "binance-bot-searxng"
  debug: false

server:
  # Overridden by the SEARXNG_SECRET env var (see docker-compose.yml).
  secret_key: "change-me-via-SEARXNG_SECRET"
  limiter: false        # only the bot container can reach it
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json              # the bot reads /search?format=json

# Keep it quick: the optimizer fires a few queries.
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0

# Some of the engines above are disabled by default in SearXNG: switch them on.
engines:
  - name: yahoo
    disabled: false
  - name: yep
    disabled: false
  - name: hackernews
    disabled: false
