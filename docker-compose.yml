services:
  binance-bot:
    build: .
    container_name: binance-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bot_net

  agent-service:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    container_name: agent-service
    restart: unless-stopped
    ports:
      - "8090:80"
    networks:
      - bot_net
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-gemma4:26b}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
    volumes:
      - ./agent-service:/var/www/html
      - ./.env:/var/www/html/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  bot_net:
    driver: bridge
