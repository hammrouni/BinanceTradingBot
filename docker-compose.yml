services:
  binance-bot:
    build: .
    container_name: binance-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Web research for the simulator's AI Optimizer; empty value disables it
      - SEARXNG_URL=${SEARXNG_URL-http://searxng:8080}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bot_net

  agent-service:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    container_name: agent-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - bot_net
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-gemma4:26b}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-16384}
      - LLM_JSON_MODE=${LLM_JSON_MODE:-1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    # No bind mount of ./agent-service: it would hide the vendor/ folder composer installed in the image.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Private SearXNG metasearch for the AI Optimizer. Own container name, own network, NO host port:
  # it cannot clash with another SearXNG on this machine and is not reachable from outside Docker.
  searxng:
    image: searxng/searxng:2026.10.11-ad46ebd7d
    container_name: binance-searxng
    restart: unless-stopped
    networks:
      - bot_net
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-binance-bot-internal-searxng-secret}
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  bot_net:
    driver: bridge
